name: Tests

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5" ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Validate composer.json and composer.lock
        if: matrix.php == '7.4'
        run: composer validate --strict

      - name: Check PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: Check JSON files
        run: |
          for file in theme.json styles/*.json; do
            php -r 'json_decode( file_get_contents( $argv[1] ) ); exit( json_last_error() ? 1 : 0 );' "$file" || { echo "Invalid JSON: $file"; exit 1; }
          done

  site:
    name: WordPress ${{ matrix.wp }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: "8.4"
          - wp: latest
            php: "7.4"
          - wp: "6.6"
            php: "7.4"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Set up WordPress
        run: WP_VERSION=${{ matrix.wp }} tests/setup.sh "$RUNNER_TEMP/site"

      - name: Check the theme renders
        run: tests/run.sh "$RUNNER_TEMP/site"
