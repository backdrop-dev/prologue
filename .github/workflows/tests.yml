name: Tests

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5" ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Validate composer.json and composer.lock
        if: matrix.php == '7.4'
        run: composer validate --strict

      - name: Check PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: Check JSON files
        run: |
          for file in theme.json styles/*.json; do
            php -r 'json_decode( file_get_contents( $argv[1] ) ); exit( json_last_error() ? 1 : 0 );' "$file" || { echo "Invalid JSON: $file"; exit 1; }
          done

  site:
    name: WordPress ${{ matrix.wp }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: "8.4"
          - wp: latest
            php: "7.4"
          - wp: "7.1"
            php: "8.5"
          - wp: "6.6"
            php: "7.4"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Set up WordPress
        run: WP_VERSION=${{ matrix.wp }} tests/setup.sh "$RUNNER_TEMP/site"

      - name: Check the theme renders
        run: tests/run.sh "$RUNNER_TEMP/site"

  test-data:
    name: Theme Test Data, WordPress ${{ matrix.wp }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: "8.4"
          - wp: "7.1"
            php: "8.5"
          - wp: "6.6"
            php: "7.4"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Set up WordPress
        run: WP_VERSION=${{ matrix.wp }} tests/setup.sh "$RUNNER_TEMP/site"

      - name: Import the Theme Test Data
        run: tests/import-test-data.sh "$RUNNER_TEMP/site"

      - name: Check every page renders
        run: tests/crawl.sh "$RUNNER_TEMP/site"

  static-analysis:
    name: PHPCS, PHPStan, PHPUnit and theme.json schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate theme.json against the schema
        run: composer validate-theme-json

      - name: Check coding standards
        run: composer phpcs

      - name: Run PHPStan
        run: composer phpstan

      - name: Run unit tests
        run: composer phpunit

      - name: Check for outdated dependencies
        run: composer outdated --direct --strict
        continue-on-error: true

  release:
    name: Release zip and Theme Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Set up WordPress
        run: tests/setup.sh "$RUNNER_TEMP/site"

      - name: Build the zip and run Theme Check
        run: tests/check-release.sh "$RUNNER_TEMP/site"

      - name: Check the zip renders
        run: tests/run.sh "$RUNNER_TEMP/site"

  clone:
    name: Renamed clone passes review checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip
          tools: composer

      - name: Rename Prologue to Harbor Light
        run: >
          php bin/rename.php "Harbor Light"
          --author="Test Author"
          --author-uri=https://example.com
          --theme-uri=https://example.com/harbor-light
          --contributor=testauthor
          --description="A calm block theme for writers."

      - name: Check nothing still says Prologue
        run: |
          if grep -rni prologue --exclude-dir=.git --exclude-dir=.github --exclude-dir=vendor --exclude-dir=bin --exclude=composer.lock .; then
            echo "Found Prologue after renaming." >&2
            exit 1
          fi

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Set up WordPress
        run: tests/setup.sh "$RUNNER_TEMP/site"

      - name: Build the zip and run Theme Check
        run: tests/check-release.sh "$RUNNER_TEMP/site"

      - name: Check the zip renders
        run: tests/run.sh "$RUNNER_TEMP/site"

      - name: Import the Theme Test Data and crawl every page
        run: |
          tests/import-test-data.sh "$RUNNER_TEMP/site"
          tests/crawl.sh "$RUNNER_TEMP/site"
